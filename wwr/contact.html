<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us.</title>
  <meta name="description" content="A contact us page for a whitewater rafting company that shows information about various ways to reach out">
  <meta name="author" content="Josiah Mecham">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/z-raftingbw.jpg" alt="The logo for the rafting company">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>
  <main>
    <div>
      <h1 class="hero-about">Rafting Company Name</h1>
      <div>
        <h2>123 Main street</h2>
        <h2>anytown, USA</h2>
        <h2>1 (234) 567-8900</h2>
        <h2>info@raftingcompany.com</h2>
      </div>
    </div>
    <section class="map">
      <div class="center">
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d29875.44906049825!2d-110.14677472176194!3d38.993936489020676!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sus!4v1795565177584!5m2!1sen!2sus" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <form class="border-box">
        <div class="quiz-item box form-row">
          <label for="name">Name:</label>
          <input type="text" name="name" id="name">
        </div>
        <div class="quiz-item box form-row">
          <label for="email">Email:</label>
          <input type="email" name="email" id="email" placeholder="John-rafter@rafting.com">
        </div>
        <div class="quiz-item box row">
          <legend>What is the purpose of your inquiry?</legend>
          <div class="radio">
            <label><input type="radio" name="contact" value="general">General Inquiry</label>
            <label><input type="radio" name="contact" value="availability">Availability</label>
            <label><input type="radio" name="contact" value="john">Who is John Rafter?</label>
          </div>
        </div>
        <div class="quiz-item box">
          <label for="message">Message</label>
          <textarea name="message" id="message" rows="3" placeholder="Type here"></textarea>
        </div>
        <div class="quiz-item box radio">
          <label class=""><input type="checkbox" id="subscribe" name="subscribe">Sign me up for monthly newsletters</label>
        </div>
        <div class="quiz-item">
          <button type="submit">Send</button>
        </div>
      </form>
    </section>
    <section>
      <h2>We are here to serve you!</h2>
      <div class="employee-gallery">
        <figure>
          <img src="images/Employee-1.jpg" alt="rafting lead">
          <figcaption>Meet our rafting lead!.</figcaption>
        </figure>
        <figure>
          <img src="images/employee-2.jpg" alt="head cook">
          <figcaption>Meet our head cook</figcaption>
        </figure>
        <figure>
          <img src="images/Employee-3.jpg" alt="our photographer">
          <figcaption>Meet our photographer</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <p>©️2026 | Josiah Mecham | USA</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook-square.jpg" alt="facebook">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram-square.jpg" alt="instagram">
      </a>
      <a href="https://youtube.com">
        <img src="images/youtube-square.jpg" alt="youtube">
      </a>
    </nav>
  </footer>

</body>

</html>
