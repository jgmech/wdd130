<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Form</title>
  <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
  <header>
    <h1>Yes or No?</h1>
  </header>
  <main class="border-box">
    <form class="border-box">
      <div class="quiz-item box">
        <label for="q1">Yes or No?</label>
        <input type="text" name="q1" id="q1">
      </div>
      <div class="quiz-item box">
        <label for="q2">No or Yes?</label>
        <textarea name="q2" id="q2" rows="3"></textarea>
      </div>
      <div class="quiz-item box">
        <label for="q3">Yes, No, or Maybe?.</label>
        <select name="q3" id="q3">
          <option value="" selected disabled>Choose one...</option>
          <option value="yes">A. Yes</option>
          <option value="no">B. No</option>
          <option value="maybe">C. Maybe</option>
        </select>
      </div>
      <div class="quiz-item box">
        <label for="q4">1 for Yes 2 for No</label>
        <code class="box">1. Yes 2. No</code>
        <input type="number" name="q4" id="q4">
      </div>
      <div class="quiz-item">
        <button type="submit">Submit Yes or No</button>
      </div>
    </form>
  </main>
</body>

</html>
